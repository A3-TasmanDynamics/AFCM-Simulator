name: Sync to Delivery Board

on:
  issues:
    types: [opened, reopened, closed, transferred]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review]

jobs:
  add-to-project:
    name: Add issue/PR to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/A3-TasmanDynamics/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}
