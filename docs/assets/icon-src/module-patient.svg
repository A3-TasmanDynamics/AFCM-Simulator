<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Single reclining patient, for the Zeus "Spawn Patient" and Eden "AFCM Patient" modules.
       White silhouette on transparent background (Arma module-icon convention), small red cross
       accent for the AFCM brand. Simple/bold so it reads at small Zeus/Eden browser sizes. -->

  <!-- Ground line -->
  <rect x="14" y="88" width="88" height="5" rx="2.5" fill="#f2efe6" opacity="0.55"/>

  <!-- Reclining body (lying on back, head to the left) -->
  <g fill="#f2efe6">
    <circle cx="30" cy="76" r="11"/>
    <rect x="38" y="70" width="46" height="13" rx="6.5"/>
    <rect x="80" y="66" width="8" height="13" rx="4" transform="rotate(20 84 72.5)"/>
    <rect x="80" y="80" width="8" height="13" rx="4" transform="rotate(-15 84 86.5)"/>
    <rect x="40" y="80" width="8" height="15" rx="4" transform="rotate(70 44 87.5)"/>
    <rect x="55" y="80" width="8" height="15" rx="4" transform="rotate(55 59 87.5)"/>
  </g>

  <!-- Medical cross badge -->
  <g transform="translate(96,34)">
    <circle r="22" fill="#1c2e20" stroke="#f2efe6" stroke-width="3"/>
    <rect x="-11" y="-3.5" width="22" height="7" rx="2" fill="#c1272d"/>
    <rect x="-3.5" y="-11" width="7" height="22" rx="2" fill="#c1272d"/>
  </g>
</svg>
